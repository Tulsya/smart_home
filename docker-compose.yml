version: '3.8'

services:
  postgres:
    image: postgres:15
    container_name: postgres_db
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password
      POSTGRES_DB: smart_home
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - smart-home-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d smart_home"]
      interval: 10s
      timeout: 5s
      retries: 5

  influxdb:
    image: influxdb:2.7
    container_name: influxdb
    environment:
      INFLUXDB_DB: smart_home
      INFLUXDB_ADMIN_USER: admin
      INFLUXDB_ADMIN_PASSWORD: password
      INFLUXDB_HTTP_AUTH_ENABLED: "false"
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME: admin
      DOCKER_INFLUXDB_INIT_PASSWORD: password
      DOCKER_INFLUXDB_INIT_ORG: smart_home
      DOCKER_INFLUXDB_INIT_BUCKET: sensors
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: grafana-token-123
    ports:
      - "8086:8086"
    volumes:
      - influxdb_data:/var/lib/influxdb2
    networks:
      - smart-home-net

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    environment:
      GF_SECURITY_ALLOW_EMBEDDING: "true"
      GF_SECURITY_ALLOW_IFRAME_EMBED: "true"
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_AUTH_DISABLE_LOGIN_FORM: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    ports:
      - "3001:3000"
    volumes:
      - grafana_storage:/var/lib/grafana
    networks:
      - smart-home-net

  mosquitto:
    image: eclipse-mosquitto:latest
    container_name: mosquitto
    ports:
      - "1883:1883"
    volumes:
      - ./mosquitto.conf:/mosquitto/config/mosquitto.conf
      - mosquitto_data:/mosquitto/data
    networks:
      - smart-home-net

  backend:
    build: ./backend
    container_name: backend_app
    ports:
      - "8082:8082"
      - "2114:2114"
    environment:
      DATABASE_URL: postgres://admin:password@postgres:5432/smart_home?sslmode=disable
      INFLUX_URL: http://influxdb:8086
      INFLUX_TOKEN: grafana-token-123
      INFLUX_ORG: smart_home
      INFLUX_BUCKET: sensors
      MQTT_BROKER: tcp://mosquitto:1883
      JWT_SECRET: my-super-secret-jwt-key-smart-home-2025
      HTTP_PORT: 8082
      METRICS_PORT: 2114
    depends_on:
      postgres:
        condition: service_healthy
      influxdb:
        condition: service_started
      mosquitto:
        condition: service_started
    networks:
      - smart-home-net

volumes:
  postgres_data:
  influxdb_data:
  grafana_storage:
  mosquitto_data:

networks:
  smart-home-net:
    driver: bridge
