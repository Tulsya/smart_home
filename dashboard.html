<!DOCTYPE html>
<html>
<head>
    <title>��� Smart Home Dashboard</title>
    <meta charset="UTF-8">
    <style>
        body { font-family: Arial; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); margin: 0; padding: 20px; }
        .container { max-width: 1200px; margin: 0 auto; }
        .status-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 20px; margin-bottom: 30px; }
        .card { background: white; border-radius: 15px; padding: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.2); }
        .status-ok { border-left: 5px solid #4CAF50; }
        .status-error { border-left: 5px solid #f44336; }
        h1 { text-align: center; color: white; margin-bottom: 10px; }
        .metric { font-size: 2em; font-weight: bold; color: #333; }
        .label { color: #666; font-size: 0.9em; }
        .iframes { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; height: 500px; }
        iframe { border: none; border-radius: 10px; box-shadow: 0 10px 30px rgba(0,0,0,0.3); width: 100%; height: 100%; }
        .api-urls { background: rgba(255,255,255,0.1); padding: 20px; border-radius: 10px; color: white; }
    </style>
</head>
<body>
    <div class="container">
        <h1>��� Smart Home Monitoring System</h1>
        
        <div class="status-grid" id="statusGrid">
            <!-- Статус будет загружен автоматически -->
        </div>
        
        <div class="iframes">
            <iframe src="http://localhost:3001/d/solo/adgrcwv/smart-home?orgId=1&from=now-1h&to=now&theme=dark" title="Grafana"></iframe>
            <iframe src="http://localhost:3001/d/your-dashboard-uid?orgId=1&from=now-1h&to=now&theme=dark" title="Dashboard 2"></iframe>
        </div>
        
        <div class="api-urls">
            <h3>��� API Endpoints:</h3>
            <p><strong>Health:</strong> <a href="http://localhost:8082/api/health" target="_blank">localhost:8082/api/health</a></p>
            <p><strong>Metrics:</strong> <a href="http://localhost:2114/metrics" target="_blank">localhost:2114/metrics</a></p>
            <p><strong>Grafana:</strong> <a href="http://localhost:3001" target="_blank">localhost:3001 (admin/admin)</a></p>
        </div>
    </div>

    <script>
        // Автообновление статуса каждые 5 сек
        async function updateStatus() {
            try {
                const response = await fetch('http://localhost:8082/api/health');
                const data = await response.json();
                
                const grid = document.getElementById('statusGrid');
                grid.innerHTML = `
                    <div class="card status-ok">
                        <div class="metric">${data.status}</div>
                        <div class="label">System Status</div>
                    </div>
                    <div class="card status-ok">
                        <div class="metric">${data.mqtt ? '��� ONLINE' : '��� OFFLINE'}</div>
                        <div class="label">MQTT Broker</div>
                    </div>
                    <div class="card status-ok">
                        <div class="metric">${data.postgres ? '��� OK' : '��� ERROR'}</div>
                        <div class="label">PostgreSQL</div>
                    </div>
                    <div class="card status-ok">
                        <div class="metric">${data.influxdb ? '��� OK' : '��� ERROR'}</div>
                        <div class="label">InfluxDB</div>
                    </div>
                `;
            } catch(e) {
                document.getElementById('statusGrid').innerHTML = 
                    '<div class="card status-error"><div class="metric">��� ERROR</div><div class="label">Backend Offline</div></div>';
            }
        }
        
        // Обновляем каждые 5 секунд
        updateStatus();
        setInterval(updateStatus, 5000);
    </script>
</body>
</html>
